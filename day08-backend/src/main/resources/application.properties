server.port=${BACKEND_PORT:8080}
spring.application.name=recruit-web
# HBase 的 ZooKeeper 地址。默认 127.0.0.1（后端与 HBase 同机部署时够用），
# 部署到单独的 HBase 服务器时用环境变量覆盖，例如：
#   export ZK_QUORUM=10.0.0.5
#   java -jar target/demo-0.0.1-SNAPSHOT.jar --hbase.zookeeper.quorum=$ZK_QUORUM
# 注意：不要把真实内网地址写进仓库，用 config/local.env 或环境变量注入。
hbase.zookeeper.quorum=${ZK_QUORUM:127.0.0.1}
hbase.zookeeper.property.clientPort=${ZK_PORT:2181}

# JWT secret is mandatory; do not commit a real deployment secret.
security.jwt-secret=${JWT_SECRET:}
# Demonstration default requested by the project owner; used only when the admin is absent.
security.admin-initial-password=${ADMIN_INITIAL_PASSWORD:123456}
security.mail-from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.debug=false
