<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找工作 · 智聘</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-container"></div>

<div class="search-layout">
  <!-- 筛选侧栏 -->
  <div class="filter-sidebar">
    <div class="card">
      <h3>筛选条件</h3>
      <div class="filter-group">
        <h4>城市</h4>
        <div id="cityFilter"></div>
      </div>
      <div class="filter-group">
        <h4>薪资范围（K）</h4>
        <div style="display:flex;gap:6px;">
          <input type="number" id="salMin" placeholder="最低" style="width:80px;padding:6px;border:1px solid var(--border);border-radius:6px;">
          <span>-</span>
          <input type="number" id="salMax" placeholder="最高" style="width:80px;padding:6px;border:1px solid var(--border);border-radius:6px;">
        </div>
      </div>
      <div class="filter-group">
        <h4>岗位类别</h4>
        <div id="catFilter"></div>
      </div>
      <button onclick="doSearch(1)" style="width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;">筛选</button>
    </div>
  </div>

  <!-- 岗位列表 -->
  <div class="job-list-area">
    <div class="result-bar">
      <span class="result-count" id="resultCount"></span>
      <input type="text" id="kwInput" placeholder="搜索关键词..." style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;width:240px;">
    </div>
    <div id="jobList"></div>
    <div id="pagination"></div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
injectNavbar('search');

var CATEGORIES = ["全部","后端开发","前端开发","移动开发","测试","运维","数据","算法","产品","设计","安全"];
var curPage = 1;
var curCity = '';
var curKeyword = '';
var curCategory = '全部';

// 从 URL 参数初始化
function initFromURL() {
  var params = new URLSearchParams(location.search);
  curCity = params.get('city') || '';
  curKeyword = params.get('keyword') || '';
  document.getElementById('kwInput').value = curKeyword;
}

// 渲染城市筛选：城市池取自岗位数据（接口异常时回退到 common.js 的完整城市列表），不再限定热门城市
async function renderCityFilter() {
  var cities = [];
  try { cities = await api('/api/job/cities'); } catch (e) {}
  if (!Array.isArray(cities) || cities.length === 0) cities = DEFAULT_CITIES;
  var el = document.getElementById('cityFilter');
  var h = '<label><input type="radio" name="cityF" value="" ' + (!curCity?'checked':'') + ' onchange="curCity=this.value;doSearch(1)"> 全部</label>';
  cities.forEach(function(c) {
    h += '<label><input type="radio" name="cityF" value="'+c+'" ' + (curCity===c?'checked':'') + ' onchange="curCity=this.value;doSearch(1)"> '+c+'</label>';
  });
  el.innerHTML = h;
}

// 渲染类别筛选
function renderCatFilter() {
  var el = document.getElementById('catFilter');
  var h = '';
  CATEGORIES.forEach(function(c) {
    h += '<label><input type="radio" name="catF" value="'+c+'" ' + (curCategory===c?'checked':'') + ' onchange="curCategory=this.value;doSearch(1)"> '+c+'</label>';
  });
  el.innerHTML = h;
}

async function doSearch(page) {
  curPage = page || 1;
  curKeyword = document.getElementById('kwInput').value;
  var salMin = document.getElementById('salMin').value || 0;
  var salMax = document.getElementById('salMax').value || 0;
  var url = '/api/job/search?page=' + curPage + '&size=10';
  if (curCity) url += '&city=' + encodeURIComponent(curCity);
  if (curKeyword) url += '&keyword=' + encodeURIComponent(curKeyword);
  if (curCategory && curCategory !== '全部') url += '&category=' + encodeURIComponent(curCategory);
  if (salMin > 0) url += '&salaryMin=' + salMin;
  if (salMax > 0) url += '&salaryMax=' + salMax;

  var res = await api(url);
  var list = res.list || [];
  document.getElementById('resultCount').textContent = '共 ' + res.total + ' 个岗位（第 ' + res.page + '/' + (res.totalPages||1) + ' 页）';
  var el = document.getElementById('jobList');
  if (list.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">没有找到匹配的岗位</div>';
  } else {
    el.innerHTML = list.map(jobCardHTML).join('');
  }
  // 分页
  document.getElementById('pagination').innerHTML = paginationHTML(res.page, res.totalPages || 1);
}

initFromURL();
renderCityFilter();
renderCatFilter();
doSearch(1);
</script>
</body>
</html>
