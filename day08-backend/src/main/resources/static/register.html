<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · 智聘</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h2>注册</h2>
    <div class="alert alert-error" id="alertBox"></div>
    <div class="alert alert-success" id="successBox"></div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="3-20位字符">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="至少6位">
    </div>
    <div class="form-group">
      <label>确认密码</label>
      <input type="password" id="password2" placeholder="再输入一次">
    </div>
    <div class="form-group">
      <label>邮箱（选填）</label>
      <input type="text" id="email" placeholder="email@example.com">
    </div>
    <button class="btn-submit" onclick="doRegister()">注册</button>
    <div class="auth-footer">
      已有账号？<a href="/login.html">去登录</a>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
function showAlert(msg) {
  var b = document.getElementById('alertBox');
  b.textContent = msg;
  b.className = 'alert alert-error show';
}

async function doRegister() {
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  var password2 = document.getElementById('password2').value;
  var email = document.getElementById('email').value.trim();
  if (!username || username.length < 3) { showAlert('用户名至少3个字符'); return; }
  if (!password || password.length < 6) { showAlert('密码至少6位'); return; }
  if (password !== password2) { showAlert('两次密码不一致'); return; }
  try {
    var res = await api('/api/user/register', {
      method: 'POST',
      body: JSON.stringify({ username: username, password: password, email: email })
    });
    if (res.success) {
      localStorage.setItem('recruit_token', res.token);
      localStorage.setItem('recruit_username', res.username);
      location.href = '/index.html';
    } else {
      showAlert(res.msg || '注册失败');
    }
  } catch(e) {
    showAlert('网络错误，请重试');
  }
}

document.getElementById('password2').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doRegister();
});
</script>
</body>
</html>
