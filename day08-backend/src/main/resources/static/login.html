<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 智聘</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/email-auth.css">
</head>
<body>
<div id="navbar-container"></div>

<div class="login-page">
  <div class="login-card">
    <div class="login-tabs">
      <button class="login-tab active" onclick="switchTab('user')">用户登录</button>
      <button class="login-tab" onclick="switchTab('company')">企业登录</button>
      <button class="login-tab" onclick="switchTab('admin')">管理员登录</button>
    </div>

    <!-- 用户登录 -->
    <div id="userPanel" class="login-panel active">
      <h2>欢迎回来</h2>
      <p class="login-hint">登录后查看岗位、管理简历</p>
      <div class="auth-mode" role="group" aria-label="登录方式"><button id="userPasswordMode" type="button" aria-pressed="true" onclick="switchMode('user', 'password')">密码登录</button><button id="userEmailMode" type="button" aria-pressed="false" onclick="switchMode('user', 'email')">邮箱验证码登录</button></div>
      <input type="text" id="userUsername" placeholder="用户名" class="login-input">
      <input type="password" id="userPassword" placeholder="密码" class="login-input">
      <div id="userEmailFields" hidden>
<input type="email" id="userEmail" placeholder="注册邮箱" aria-label="注册邮箱" autocomplete="email" required class="login-input">
<div class="email-code-row"><input id="userCode" class="login-input" placeholder="6 位邮箱验证码" aria-label="邮箱验证码" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><button id="userSendCode" class="email-send" type="button">发送验证码</button></div>
</div>
      <button class="login-btn" onclick="userLogin()">登录</button>
      <p class="login-tip">没有账号? <a href="/register.html">立即注册</a></p>
      <p class="login-tip"><a href="/forgot-password.html?type=user">忘记密码？</a></p>
    </div>

    <!-- 企业登录 -->
    <div id="companyPanel" class="login-panel">
      <h2>企业登录</h2>
      <p class="login-hint">登录后管理岗位、浏览人才</p>
      <div class="auth-mode" role="group" aria-label="登录方式"><button id="compPasswordMode" type="button" aria-pressed="true" onclick="switchMode('company', 'password')">密码登录</button><button id="compEmailMode" type="button" aria-pressed="false" onclick="switchMode('company', 'email')">邮箱验证码登录</button></div>
      <input type="text" id="compUsername" placeholder="企业账号" class="login-input">
      <input type="password" id="compPassword" placeholder="密码" class="login-input">
      <div id="compEmailFields" hidden>
<input type="email" id="compEmail" placeholder="注册邮箱" aria-label="注册邮箱" autocomplete="email" required class="login-input">
<div class="email-code-row"><input id="compCode" class="login-input" placeholder="6 位邮箱验证码" aria-label="邮箱验证码" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><button id="compSendCode" class="email-send" type="button">发送验证码</button></div>
</div>
      <button class="login-btn" onclick="companyLogin()">登录</button>
      <p class="login-tip">没有企业账号? <a href="/register.html?type=company">立即注册</a></p>
      <p class="login-tip"><a href="/forgot-password.html?type=company">忘记密码？</a></p>
    </div>

    <!-- 管理员登录 -->
    <div id="adminPanel" class="login-panel">
      <h2>管理员登录</h2>
      <p class="login-hint">管理账号安全状态与解封申请</p>
      <input type="text" id="adminUsername" placeholder="管理员账号" aria-label="管理员账号" autocomplete="username" class="login-input">
      <input type="password" id="adminPassword" placeholder="密码" aria-label="管理员密码" autocomplete="current-password" class="login-input">
      <button class="login-btn" onclick="adminLogin()">登录</button>
      <p class="login-tip">管理员账号由系统初始化，不开放注册</p>
    </div>
    <p id="loginMessage" role="status" aria-live="polite" style="color:#b42318;margin-top:16px"></p>
    <p class="login-test">演示账号：admin / 123456 · xiaoliyu / 123456 · zhangsan / 123456</p>
  </div>
</div>

<style>
.login-page {
  min-height: calc(100vh - 60px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}
.login-card {
  background: #fff;
  border-radius: 16px;
  padding: 40px;
  width: 460px;
  max-width: calc(100vw - 32px);
  box-sizing: border-box;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
.login-tabs {
  display: flex;
  margin-bottom: 30px;
  border-bottom: 2px solid var(--bg);
}
.login-tab {
  flex: 1;
  padding: 12px;
  border: none;
  background: none;
  font-size: 16px;
  cursor: pointer;
  color: var(--text-light);
  border-bottom: 3px solid transparent;
  transition: all .2s;
}
.login-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 600;
}
.login-panel { display: none; }
.login-panel.active { display: block; }
.login-panel h2 { margin: 0 0 8px; font-size: 24px; }
.login-hint { color: var(--text-light); margin: 0 0 24px; font-size: 13px; }
.login-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 12px;
  outline: none;
  box-sizing: border-box;
  transition: border-color .2s;
}
.login-input:focus { border-color: var(--primary); }
.login-btn {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 8px;
  transition: background .2s;
}
.login-btn:hover { background: var(--primary-dark); }
.login-tip { text-align: center; margin: 16px 0 0; font-size: 13px; }
.login-test { text-align: center; color: var(--text-light); font-size: 12px; margin: 8px 0 0; }
</style>

<script src="/js/common.js"></script>
<script src="/js/email-code.js"></script>
<script>
injectNavbar('login');
var loginModes = {user:'password', company:'password', admin:'password'};
var loginForms = {};

function switchTab(type) {
  ['user','company','admin'].forEach(function (name, index) {
    document.querySelectorAll('.login-tab')[index].classList.toggle('active', name === type);
    document.getElementById(name + 'Panel').classList.toggle('active', name === type);
  });
  Object.values(loginForms).forEach(form => form.clear());
  document.getElementById('loginMessage').textContent = '';
}
async function login(type, prefix) {
  var username = document.getElementById(prefix + 'Username').value.trim();
  var password = document.getElementById(prefix + 'Password').value;
  var message = document.getElementById('loginMessage');
  var emailMode = loginModes[type] === 'email';
  var email = emailMode ? document.getElementById(prefix + 'Email').value.trim() : '';
  var code = emailMode ? document.getElementById(prefix + 'Code').value.trim() : '';
  if (emailMode && (!username || !email || !document.getElementById(prefix + 'Email').checkValidity() || !/^[0-9]{6}$/.test(code))) { message.textContent = '请输入账号、注册邮箱和 6 位验证码'; return; }
  if (!emailMode && (!username || !password)) { message.textContent = '请输入账号和密码'; return; }
  var button = document.querySelector('#' + type + 'Panel .login-btn');
  if (button.disabled) return;
  button.disabled = true;
  message.textContent = '正在登录…';
  try {
    var result = await api(emailMode ? '/api/auth/email-login/confirm' : '/api/' + type + '/login',
      {method:'POST', body:JSON.stringify(emailMode ? {accountType:type, username, email, code} : {username, password})});
    if (result.code === 0) saveLogin(result);
    else message.textContent = result.msg || '登录失败，请重试';
  } catch (error) { message.textContent = error.message || '网络连接失败，请稍后重试'; }
  finally { button.disabled = false; }
}
function userLogin() { return login('user', 'user'); }
function companyLogin() { return login('company', 'comp'); }
function adminLogin() { return login('admin', 'admin'); }
['user','comp','admin'].forEach(function(prefix) {
  document.getElementById(prefix + 'Password').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      var button = this.closest('.login-panel').querySelector('.login-btn');
      if (!button.disabled) button.click();
    }
  });
});
function switchMode(type, mode) {
  var prefix = type === 'user' ? 'user' : 'comp';
  loginModes[type] = mode;
  document.getElementById(prefix + 'Password').hidden = mode === 'email';
  document.getElementById(prefix + 'EmailFields').hidden = mode !== 'email';
  document.getElementById(prefix + 'PasswordMode').setAttribute('aria-pressed', String(mode === 'password'));
  document.getElementById(prefix + 'EmailMode').setAttribute('aria-pressed', String(mode === 'email'));
  loginForms[type].clear();
}
['user','company'].forEach(function (type) {
  var prefix = type === 'user' ? 'user' : 'comp';
  loginForms[type] = emailCodeForm({button:prefix+'SendCode', code:prefix+'Code', message:'loginMessage',
    path:'/api/auth/email-login/code', fields:[prefix+'Username',prefix+'Email'],
    identity:() => ({accountType:type, username:document.getElementById(prefix+'Username').value.trim(), email:document.getElementById(prefix+'Email').value.trim()}),
    valid:() => document.getElementById(prefix+'Email').checkValidity()});
  document.getElementById(prefix+'Code').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') login(type, prefix);
  });
});
var selectedType = new URLSearchParams(location.search).get('type');
if (['user','company','admin'].includes(selectedType)) switchTab(selectedType);
var expiredMessage = sessionStorage.getItem('recruit_login_message');
if (expiredMessage) {
  document.getElementById('loginMessage').textContent = expiredMessage;
  sessionStorage.removeItem('recruit_login_message');
}
</script>
</body>
</html>
