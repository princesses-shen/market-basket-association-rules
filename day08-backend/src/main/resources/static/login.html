<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 智聘</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h2>登录</h2>
    <div class="alert alert-error" id="alertBox"></div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="输入用户名">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="输入密码">
    </div>
    <button class="btn-submit" onclick="doLogin()">登录</button>
    <div class="auth-footer">
      还没有账号？<a href="/register.html">立即注册</a>
    </div>
    <div style="margin-top:16px;padding:12px;background:#f8f9fa;border-radius:8px;font-size:13px;color:#666;">
      测试账号：admin/123456 · xiaoliyu/123456 · zhangsan/123456
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
function showAlert(msg) {
  var b = document.getElementById('alertBox');
  b.textContent = msg;
  b.className = 'alert alert-error show';
}

async function doLogin() {
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  if (!username || !password) { showAlert('请填写用户名和密码'); return; }
  try {
    var res = await api('/api/user/login', {
      method: 'POST',
      body: JSON.stringify({ username: username, password: password })
    });
    if (res.success) {
      localStorage.setItem('recruit_token', res.token);
      localStorage.setItem('recruit_username', res.username);
      location.href = '/index.html';
    } else {
      showAlert(res.msg || '登录失败');
    }
  } catch(e) {
    showAlert('网络错误，请重试');
  }
}

document.getElementById('password').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
