<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 · 智聘</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-container"></div>

<div class="password-page">
  <div class="password-card">
    <h2>修改密码</h2>
    <p id="accountHint" class="password-hint"></p>
    <label>原密码</label>
    <input id="oldPassword" type="password" autocomplete="current-password" placeholder="请输入当前密码">
    <label>新密码</label>
    <input id="newPassword" type="password" autocomplete="new-password" placeholder="至少 6 位">
    <label>确认新密码</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入新密码">
    <button id="submitButton" onclick="changePassword()">确认修改</button>
    <div id="message" class="password-message"></div>
  </div>
</div>

<style>
.password-page { min-height:calc(100vh - 60px); display:flex; align-items:center; justify-content:center; background:var(--bg); }
.password-card { width:420px; max-width:calc(100% - 40px); background:#fff; padding:34px; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
.password-card h2 { margin:0 0 8px; }
.password-hint { color:var(--text-light); margin:0 0 24px; font-size:13px; }
.password-card label { display:block; margin:14px 0 6px; font-size:13px; color:var(--text-light); }
.password-card input { width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid var(--border); border-radius:8px; outline:none; }
.password-card input:focus { border-color:var(--primary); }
.password-card button { width:100%; margin-top:24px; padding:12px; border:0; border-radius:8px; color:#fff; background:var(--primary); cursor:pointer; font-size:15px; }
.password-card button:disabled { opacity:.6; cursor:not-allowed; }
.password-message { min-height:20px; margin-top:14px; text-align:center; font-size:13px; }
</style>

<script src="/js/common.js"></script>
<script>
injectNavbar('change-password');
var username = currentUser();
var role = localStorage.getItem('recruit_role') || 'user';
if (!username) {
  alert('请先登录');
  location.href = '/login.html';
}
document.getElementById('accountHint').textContent =
  (role === 'company' ? '企业账号：' : '用户账号：') + username;

async function changePassword() {
  var oldPassword = document.getElementById('oldPassword').value;
  var newPassword = document.getElementById('newPassword').value;
  var confirmPassword = document.getElementById('confirmPassword').value;
  var message = document.getElementById('message');
  if (!oldPassword) { message.style.color='#e74c3c'; message.textContent='请输入原密码'; return; }
  if (newPassword.length < 6) { message.style.color='#e74c3c'; message.textContent='新密码至少需要 6 位'; return; }
  if (newPassword !== confirmPassword) { message.style.color='#e74c3c'; message.textContent='两次输入的新密码不一致'; return; }

  var button = document.getElementById('submitButton');
  button.disabled = true;
  var endpoint = role === 'company' ? '/api/company/change-password' : '/api/user/change-password';
  try {
    var result = await api(endpoint, {
      method: 'POST',
      body: JSON.stringify({
        username: username,
        oldPassword: oldPassword,
        newPassword: newPassword
      })
    });
    if (result.code === 0) {
      message.style.color = '#27ae60';
      message.textContent = result.msg;
      setTimeout(function() { logout(); }, 1200);
    } else {
      message.style.color = '#e74c3c';
      message.textContent = result.msg || '修改失败';
      button.disabled = false;
    }
  } catch (e) {
    message.style.color = '#e74c3c';
    message.textContent = '网络错误，请稍后重试';
    button.disabled = false;
  }
}

document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') changePassword();
});
</script>
</body>
</html>
