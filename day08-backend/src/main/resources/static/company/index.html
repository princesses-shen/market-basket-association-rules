<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>企业主页 · 智聘</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-container"></div>

<div class="company-home">
  <!-- Hero -->
  <div class="company-hero">
    <div class="hero-left">
      <h1 id="welcomeTitle">企业控制台</h1>
      <p id="welcomeSub">管理岗位 · 浏览人才 · 发布招聘</p>
    </div>
    <div class="hero-right">
      <div class="hero-stat">
        <div class="stat-num" id="jobCount">0</div>
        <div class="stat-label">已发布岗位</div>
      </div>
      <div class="hero-stat">
        <div class="stat-num" id="activeCount">0</div>
        <div class="stat-label">在招岗位</div>
      </div>
      <div class="hero-stat">
        <div class="stat-num" id="talentCount">0</div>
        <div class="stat-label">候选人库</div>
      </div>
      <div class="hero-stat">
        <div class="stat-num" id="appCount">0</div>
        <div class="stat-label">收到投递</div>
      </div>
    </div>
  </div>

  <!-- 快捷操作 -->
  <div class="quick-actions">
    <div class="action-card" onclick="location.href='/company/jobs.html'">
      <div class="action-icon">+</div>
      <div class="action-title">发布岗位</div>
      <div class="action-desc">编辑招聘需求，一键发布</div>
    </div>
    <div class="action-card" onclick="location.href='/company/jobs.html'">
      <div class="action-icon">≡</div>
      <div class="action-title">岗位管理</div>
      <div class="action-desc">查看/回收已发布岗位</div>
    </div>
    <div class="action-card" onclick="location.href='/company/talent.html'">
      <div class="action-icon">★</div>
      <div class="action-title">浏览人才</div>
      <div class="action-desc">搜索候选人简历</div>
    </div>
    <div class="action-card" onclick="location.href='/company/chat.html'">
      <div class="action-icon">💬</div>
      <div class="action-title">消息中心</div>
      <div class="action-desc">查看投递，与求职者沟通</div>
    </div>
    <div class="action-card" onclick="location.href='/dashboard.html'">
      <div class="action-icon">📊</div>
      <div class="action-title">数据大屏</div>
      <div class="action-desc">招聘市场分析</div>
    </div>
  </div>

  <!-- 最近岗位 -->
  <div class="recent-jobs">
    <div class="section-header">
      <h3>最近发布的岗位</h3>
      <a href="/company/jobs.html">查看全部 →</a>
    </div>
    <div id="recentJobs"></div>
  </div>
</div>

<style>
.company-home { max-width: 1100px; margin: 0 auto; padding: 24px; }
.company-hero {
  background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%);
  color: #fff; border-radius: 16px; padding: 36px;
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 30px;
}
.hero-left h1 { font-size: 28px; margin: 0 0 8px; }
.hero-left p { margin: 0; opacity: 0.9; }
.hero-right { display: flex; gap: 24px; }
.hero-stat { text-align: center; }
.stat-num { font-size: 32px; font-weight: 700; }
.stat-label { font-size: 12px; opacity: 0.8; }
.quick-actions {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px; margin-bottom: 30px;
}
.action-card {
  background: #fff; border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; cursor: pointer; transition: all .2s; text-align: center;
}
.action-card:hover { border-color: var(--primary); box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-2px); }
.action-icon { font-size: 28px; color: var(--primary); margin-bottom: 8px; }
.action-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.action-desc { font-size: 12px; color: var(--text-light); }
.recent-jobs { background: #fff; border-radius: 12px; padding: 24px; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.section-header h3 { margin: 0; }
.section-header a { color: var(--primary); text-decoration: none; font-size: 13px; }
.recent-job-item {
  display: flex; justify-content: space-between; padding: 14px 0;
  border-bottom: 1px solid var(--bg);
}
.recent-job-item:last-child { border: none; }
.recent-job-title { font-weight: 600; }
.recent-job-meta { color: var(--text-light); font-size: 12px; margin-top: 4px; }
.recent-job-salary { color: #e74c3c; font-weight: 600; }
.status-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px;
  margin-left: 8px;
}
.status-tag.active { background: #d4edda; color: #155724; }
.status-tag.recalled { background: #f8d7da; color: #721c24; }
</style>

<script src="/js/common.js"></script>
<script>
injectNavbar('company-home');

var username = localStorage.getItem('recruit_username') || '';
var companyName = localStorage.getItem('recruit_company') || username;

document.getElementById('welcomeTitle').textContent = companyName + ' 企业控制台';

async function loadDashboard() {
  // 加载我的岗位
  var jobs = await fetch('/api/company/jobs?username=' + username).then(r => r.json());
  document.getElementById('jobCount').textContent = jobs.length;
  var active = jobs.filter(j => j.status === 'active' || !j.status).length;
  document.getElementById('activeCount').textContent = active;

  // 加载人才库
  var talents = await fetch('/api/company/talent?limit=200').then(r => r.json());
  document.getElementById('talentCount').textContent = talents.length;

  // 加载投递数
  try {
    var apps = await fetch('/api/chat/applications?companyUsername=' + username).then(r => r.json());
    document.getElementById('appCount').textContent = apps.length;
  } catch(e) {}

  // 最近5个岗位
  var recent = jobs.slice(0, 5);
  var el = document.getElementById('recentJobs');
  if (recent.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">还没有发布岗位，去 <a href="/company/jobs.html">发布岗位</a></div>';
  } else {
    el.innerHTML = recent.map(j => {
      var status = j.status || 'active';
      return '<div class="recent-job-item">'
        + '<div><div class="recent-job-title">' + (j.title||'') + ' <span class="status-tag ' + status + '">' + (status==='active'?'在招':'已回收') + '</span></div>'
        + '<div class="recent-job-meta">' + (j.city||'') + ' · ' + (j.edu||'') + ' · ' + (j.exp||'') + '</div></div>'
        + '<div class="recent-job-salary">' + (j.salary_low||0) + '-' + (j.salary_high||0) + 'K</div>'
        + '</div>';
    }).join('');
  }
}

loadDashboard();
</script>
</body>
</html>
