<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息中心 · 智聘企业</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-container"></div>

<div class="chat-layout">
  <div class="chat-sidebar">
    <div class="chat-sidebar-header">
      <h3>消息中心</h3>
    </div>
    <div class="chat-session-list" id="sessionList">
      <div class="chat-empty">暂无消息</div>
    </div>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="chat-placeholder">
      <div class="chat-placeholder-icon">💬</div>
      <p>选择左侧会话开始聊天</p>
      <p style="margin-top:8px;font-size:13px;">用户投递简历后将自动创建会话</p>
    </div>
  </div>
</div>

<style>
.chat-layout {
  display: flex;
  height: calc(100vh - var(--nav-height));
  max-width: 1200px;
  margin: 0 auto;
}
.chat-sidebar {
  width: 320px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: #fff;
  display: flex;
  flex-direction: column;
}
.chat-sidebar-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.chat-sidebar-header h3 {
  margin: 0;
  font-size: 18px;
  color: var(--primary-dark);
}
.chat-session-list {
  flex: 1;
  overflow-y: auto;
}
.chat-session-item {
  padding: 14px 20px;
  border-bottom: 1px solid var(--bg);
  cursor: pointer;
  transition: background .15s;
}
.chat-session-item:hover { background: var(--bg); }
.chat-session-item.active { background: #e8f0fe; border-left: 3px solid var(--primary); }
.chat-session-item .cs-title {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-session-item .cs-applicant {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
}
.chat-session-item .cs-last {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-empty {
  text-align: center;
  padding: 40px 0;
  color: #999;
  font-size: 14px;
}
.chat-window {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.chat-placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #999;
}
.chat-placeholder-icon { font-size: 48px; margin-bottom: 12px; }
.chat-header {
  padding: 16px 24px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.chat-header h3 { margin: 0; font-size: 16px; }
.chat-header p { margin: 4px 0 0; font-size: 12px; color: var(--text-light); }
.chat-header .header-actions { display: flex; gap: 12px; align-items: center; }
.chat-header .view-resume {
  font-size: 13px;
  color: var(--primary);
  cursor: pointer;
}
.btn-add-talent {
  padding: 6px 14px;
  background: var(--success);
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
}
.btn-add-talent:hover { opacity: .9; }
.btn-add-talent.added { background: #ccc; cursor: default; }
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.chat-msg {
  margin-bottom: 16px;
  display: flex;
}
.chat-msg.me { justify-content: flex-end; }
.chat-msg.other { justify-content: flex-start; }
.chat-bubble {
  max-width: 70%;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
}
.chat-msg.me .chat-bubble {
  background: var(--primary);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.chat-msg.other .chat-bubble {
  background: #fff;
  color: var(--text);
  border-bottom-left-radius: 4px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.chat-msg .chat-time {
  font-size: 11px;
  color: #aaa;
  margin-top: 4px;
}
.chat-msg.me .chat-time { text-align: right; }
.chat-attachment {
  margin-top: 8px;
  padding: 8px 12px;
  background: rgba(255,255,255,0.2);
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.chat-msg.other .chat-attachment {
  background: #f0f4ff;
}
.chat-attachment a {
  color: inherit;
  text-decoration: none;
  font-size: 13px;
}
.chat-attachment a:hover { text-decoration: underline; }
.chat-input-area {
  padding: 16px 20px;
  background: #fff;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
}
.chat-input-area textarea {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  resize: none;
  outline: none;
  height: 44px;
  max-height: 100px;
  font-family: inherit;
}
.chat-input-area textarea:focus { border-color: var(--primary); }
.chat-input-area button {
  padding: 0 24px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .2s;
}
.chat-input-area button:hover { background: var(--primary-dark); }
.chat-input-area button:disabled { background: #ccc; cursor: not-allowed; }
</style>

<script src="/js/common.js"></script>
<script>
injectNavbar('company-chat');

var username = localStorage.getItem('recruit_username') || '';
var currentSessionKey = '';
var pollTimer = null;
var currentUserUsername = '';

if (!username) {
  alert('请先登录');
  location.href = '/login.html';
}

var urlSk = new URLSearchParams(location.search).get('sk');

async function loadSessions() {
  var sessions = await api('/api/chat/sessions?username=' + username + '&role=company');
  var el = document.getElementById('sessionList');
  if (sessions.length === 0) {
    el.innerHTML = '<div class="chat-empty">暂无消息</div>';
    return;
  }
  el.innerHTML = sessions.map(function(s) {
    return '<div class="chat-session-item' + (s.rowKey === currentSessionKey ? ' active' : '') + '"'
      + ' onclick="selectSession(\'' + s.rowKey + '\')">'
      + '<div class="cs-title">' + (s.resumeName || '求职者') + ' · ' + (s.jobTitle || '') + '</div>'
      + '<div class="cs-applicant">' + (s.jobTitle || '') + '</div>'
      + '<div class="cs-last">' + (s.lastMessage || '') + '</div>'
      + '</div>';
  }).join('');
}

async function selectSession(sk) {
  currentSessionKey = sk;
  loadSessions();

  var sessions = await api('/api/chat/sessions?username=' + username + '&role=company');
  var sess = sessions.find(function(s) { return s.rowKey === sk; });
  var jobTitle = sess ? (sess.jobTitle || '') : '会话';
  var applicantName = sess ? (sess.resumeName || '求职者') : '';
  currentUserUsername = sess ? (sess.userUsername || '') : '';

  var msgs = await api('/api/chat/messages?sessionKey=' + encodeURIComponent(sk));

  var html = '<div class="chat-header">'
    + '<div><h3>' + applicantName + '</h3>'
    + '<p>应聘：' + jobTitle + '</p></div>'
    + '<div class="header-actions">'
    + '<button class="btn-add-talent" id="btnAddTalent" onclick="addToTalentPool()">加入人才库</button>'
    + '<span class="view-resume" onclick="viewResume(\'' + currentUserUsername + '\')">查看简历 →</span>'
    + '</div>'
    + '</div>'
    + '<div class="chat-messages" id="msgArea">'
    + renderMessages(msgs)
    + '</div>'
    + '<div class="chat-input-area">'
    + '<textarea id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>'
    + '<button onclick="sendMessage()">发送</button>'
    + '</div>';

  document.getElementById('chatWindow').innerHTML = html;
  var area = document.getElementById('msgArea');
  if (area) area.scrollTop = area.scrollHeight;

  checkTalentPool();

  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollMessages, 5000);
}

function renderMessages(msgs) {
  return msgs.map(function(m) {
    var isMe = (m.sender === username);
    var attachHtml = '';
    if (m.attachmentName && m.attachmentPath) {
      attachHtml = '<div class="chat-attachment">'
        + '<a href="' + m.attachmentPath + '" target="_blank" download="' + m.attachmentName + '">'
        + '📎 ' + escapeHtml(m.attachmentName) + ' (点击下载)'
        + '</a></div>';
    }
    return '<div class="chat-msg ' + (isMe ? 'me' : 'other') + '">'
      + '<div><div class="chat-bubble">' + escapeHtml(m.content || '') + attachHtml + '</div>'
      + '<div class="chat-time">' + formatTime(m.sendTime || '') + '</div></div>'
      + '</div>';
  }).join('');
}

async function checkTalentPool() {
  if (!currentUserUsername) return;
  try {
    var pool = await api('/api/chat/talent/list?companyUsername=' + encodeURIComponent(username));
    var exists = pool.find(function(t) { return t.userUsername === currentUserUsername; });
    var btn = document.getElementById('btnAddTalent');
    if (exists) {
      btn.textContent = '已在人才库';
      btn.classList.add('added');
      btn.onclick = null;
    }
  } catch(e) {}
}

async function addToTalentPool() {
  if (!currentUserUsername) return;
  var res = await api('/api/chat/talent/add', {
    method: 'POST',
    body: JSON.stringify({ companyUsername: username, userUsername: currentUserUsername })
  });
  if (res.code === 0) {
    var btn = document.getElementById('btnAddTalent');
    btn.textContent = '已在人才库';
    btn.classList.add('added');
    btn.onclick = null;
  } else {
    alert(res.msg);
  }
}

function viewResume(userUsername) {
  if (!userUsername) return;
  location.href = '/company/talent.html?u=' + encodeURIComponent(userUsername);
}

async function pollMessages() {
  if (!currentSessionKey) return;
  try {
    var msgs = await api('/api/chat/messages?sessionKey=' + encodeURIComponent(currentSessionKey));
    var area = document.getElementById('msgArea');
    if (!area) return;
    area.innerHTML = renderMessages(msgs);
    area.scrollTop = area.scrollHeight;
  } catch(e) {}
}

async function sendMessage() {
  var input = document.getElementById('msgInput');
  var content = input.value.trim();
  if (!content || !currentSessionKey) return;
  input.value = '';
  var res = await api('/api/chat/send', {
    method: 'POST',
    body: JSON.stringify({ sessionKey: currentSessionKey, sender: username, content: content })
  });
  if (res.code === 0) {
    pollMessages();
  } else {
    alert(res.msg);
  }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatTime(s) {
  if (s.length > 16) return s.substring(0, 16);
  return s;
}

window.addEventListener('beforeunload', function() {
  if (pollTimer) clearInterval(pollTimer);
});

loadSessions();
if (urlSk) {
  selectSession(urlSk);
}
</script>
</body>
</html>
