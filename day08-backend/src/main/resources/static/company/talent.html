<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人才库 · 智聘企业</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-container"></div>

<div class="page-container">
  <h2 style="margin:24px 0;">人才库</h2>
  <p style="color:var(--text-light);margin-bottom:20px;">点击姓名查看完整简历，可管理人才库</p>

  <div id="talentList" class="talent-list"></div>
</div>

<!-- 简历详情弹窗 -->
<div id="resumeModal" class="modal-overlay" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">简历详情</h3>
      <span class="modal-close" onclick="closeModal()">&times;</span>
    </div>
    <div class="modal-body" id="modalBody">
      <p style="text-align:center;color:#999;">加载中...</p>
    </div>
  </div>
</div>

<style>
.page-container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
.talent-list { display: flex; flex-direction: column; gap: 12px; }
.talent-item {
  background: #fff; border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
  transition: all .2s;
}
.talent-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-color: var(--primary); }
.talent-name { font-size: 16px; font-weight: 600; color: var(--primary-dark); cursor: pointer; }
.talent-name:hover { text-decoration: underline; }
.talent-time { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.talent-actions { display: flex; gap: 8px; }
.btn-view { padding: 6px 16px; background: var(--primary); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
.btn-view:hover { background: var(--primary-dark); }
.btn-delete { padding: 6px 16px; background: #ff4d4f; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
.btn-delete:hover { background: #d9363b; }
.talent-empty { text-align: center; padding: 60px 0; color: #999; font-size: 15px; }

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 999;
  display: flex; align-items: center; justify-content: center;
}
.modal-content {
  background: #fff; border-radius: 12px; width: 600px; max-width: 90%;
  max-height: 80vh; overflow: hidden; display: flex; flex-direction: column;
}
.modal-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-header h3 { margin: 0; font-size: 18px; }
.modal-close { font-size: 24px; cursor: pointer; color: #999; line-height: 1; }
.modal-body { padding: 24px; overflow-y: auto; }
.resume-section { margin-bottom: 20px; }
.resume-section h4 { margin: 0 0 8px; font-size: 14px; color: var(--text-light); border-bottom: 1px solid var(--bg); padding-bottom: 4px; }
.resume-row { display: flex; gap: 20px; margin-bottom: 8px; }
.resume-field { flex: 1; }
.resume-field label { font-size: 12px; color: var(--text-light); display: block; }
.resume-field span { font-size: 14px; color: var(--text); }
.resume-skills { display: flex; flex-wrap: wrap; gap: 6px; }
.skill-tag { background: var(--bg); padding: 4px 10px; border-radius: 4px; font-size: 12px; }
.resume-intro { font-size: 14px; line-height: 1.6; color: var(--text); }
</style>

<script src="/js/common.js"></script>
<script>
injectNavbar('company-talent');

var companyUsername = localStorage.getItem('recruit_username') || '';

if (!companyUsername || localStorage.getItem('recruit_role') !== 'company') {
  alert('请先以企业身份登录');
  location.href = '/login.html';
}

async function loadTalent() {
  var list = await api('/api/chat/talent/list?companyUsername=' + encodeURIComponent(companyUsername));
  var el = document.getElementById('talentList');
  if (list.length === 0) {
    el.innerHTML = '<div class="talent-empty">人才库暂无候选人<br><span style="font-size:13px;">在消息中心与求职者沟通后，可将其加入人才库</span></div>';
    return;
  }
  el.innerHTML = list.map(function(t) {
    return '<div class="talent-item">'
      + '<div>'
      + '<div class="talent-name" onclick="viewResume(\'' + t.userUsername + '\', \'' + (t.resumeName||'') + '\')">' + (t.resumeName || '匿名') + '</div>'
      + '<div class="talent-time">加入时间: ' + (t.addTime || '未知') + '</div>'
      + '</div>'
      + '<div class="talent-actions">'
      + '<button class="btn-view" onclick="viewResume(\'' + t.userUsername + '\', \'' + (t.resumeName||'') + '\')">查看简历</button>'
      + '<button class="btn-delete" onclick="removeTalent(\'' + t.userUsername + '\', \'' + (t.resumeName||'') + '\')">删除</button>'
      + '</div>'
      + '</div>';
  }).join('');
}

async function viewResume(userUsername, name) {
  document.getElementById('modalTitle').textContent = (name || '简历') + ' 的简历';
  document.getElementById('modalBody').innerHTML = '<p style="text-align:center;color:#999;">加载中...</p>';
  document.getElementById('resumeModal').style.display = 'flex';

  var resume = await api('/api/chat/talent/resume?userUsername=' + encodeURIComponent(userUsername));
  if (!resume || Object.keys(resume).length === 0) {
    document.getElementById('modalBody').innerHTML = '<p style="text-align:center;color:#999;">该用户暂未填写简历</p>';
    return;
  }
  var skills = (resume.skills || '').split(';').filter(function(s){return s;}).map(function(s){
    return '<span class="skill-tag">' + s + '</span>';
  }).join('');
  document.getElementById('modalBody').innerHTML =
    '<div class="resume-section">'
    + '<h4>基本信息</h4>'
    + '<div class="resume-row">'
    + '<div class="resume-field"><label>姓名</label><span>' + (resume.name||'') + '</span></div>'
    + '<div class="resume-field"><label>性别</label><span>' + (resume.gender||'') + '</span></div>'
    + '<div class="resume-field"><label>年龄</label><span>' + (resume.age||'') + ' 岁</span></div>'
    + '</div>'
    + '<div class="resume-row">'
    + '<div class="resume-field"><label>城市</label><span>' + (resume.city||'') + '</span></div>'
    + '<div class="resume-field"><label>学历</label><span>' + (resume.edu||'') + '</span></div>'
    + '<div class="resume-field"><label>工作年限</label><span>' + (resume.exp||'') + '</span></div>'
    + '</div>'
    + '<div class="resume-row">'
    + '<div class="resume-field"><label>电话</label><span>' + (resume.phone||'') + '</span></div>'
    + '<div class="resume-field"><label>邮箱</label><span>' + (resume.email||'') + '</span></div>'
    + '</div>'
    + '</div>'
    + '<div class="resume-section">'
    + '<h4>技能标签</h4>'
    + '<div class="resume-skills">' + (skills || '<span style="color:#999;">暂无</span>') + '</div>'
    + '</div>'
    + '<div class="resume-section">'
    + '<h4>自我介绍</h4>'
    + '<div class="resume-intro">' + (resume.self_intro || '暂无') + '</div>'
    + '</div>';
}

async function removeTalent(userUsername, name) {
  if (!confirm('确定将 ' + (name||'该用户') + ' 从人才库移除吗？')) return;
  var res = await api('/api/chat/talent/remove', {
    method: 'POST',
    body: JSON.stringify({ companyUsername: companyUsername, userUsername: userUsername })
  });
  if (res.code === 0) {
    alert('已移除');
    loadTalent();
  } else {
    alert(res.msg);
  }
}

function closeModal() {
  document.getElementById('resumeModal').style.display = 'none';
}

document.getElementById('resumeModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

loadTalent();
</script>
</body>
</html>
