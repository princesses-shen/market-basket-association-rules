<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薪资预测 · 智聘</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-container"></div>

<div class="predict-page">
  <div class="predict-hero">
    <h1>AI 薪资预测</h1>
    <p>基于 XGBoost 分位数回归模型，输入你的条件，预测薪资范围</p>
  </div>

  <div class="predict-layout">
    <!-- 输入表单 -->
    <div class="predict-form card">
      <h3>输入条件</h3>

      <div class="form-group">
        <label>城市</label>
        <select id="citySel" class="form-select">
          <option value="北京">北京</option>
          <option value="上海">上海</option>
          <option value="广州">广州</option>
          <option value="深圳">深圳</option>
          <option value="杭州">杭州</option>
          <option value="成都">成都</option>
          <option value="南京">南京</option>
          <option value="武汉">武汉</option>
          <option value="西安">西安</option>
          <option value="长沙">长沙</option>
          <option value="苏州">苏州</option>
          <option value="重庆">重庆</option>
          <option value="天津">天津</option>
          <option value="青岛">青岛</option>
          <option value="厦门">厦门</option>
        </select>
      </div>

      <div class="form-group">
        <label>学历要求</label>
        <select id="eduSel" class="form-select">
          <option value="不限">不限</option>
          <option value="大专">大专</option>
          <option value="本科" selected>本科</option>
          <option value="硕士">硕士</option>
          <option value="博士">博士</option>
        </select>
      </div>

      <div class="form-group">
        <label>工作经验</label>
        <select id="expSel" class="form-select">
          <option value="应届">应届</option>
          <option value="1年">1年</option>
          <option value="1-3年">1-3年</option>
          <option value="3-5年" selected>3-5年</option>
          <option value="5-10年">5-10年</option>
          <option value="10年以上">10年以上</option>
        </select>
      </div>

      <div class="form-group">
        <label>技术标签（分号分隔）</label>
        <input type="text" id="tagsInput" value="Java;Spring;MySQL" placeholder="如: Java;Spring;MySQL" class="form-input">
      </div>

      <div class="form-group">
        <label>公司档次</label>
        <select id="tierSel" class="form-select">
          <option value="中小-初创">中小-初创</option>
          <option value="成长型企业">成长型企业</option>
          <option value="中大型企业" selected>中大型企业</option>
          <option value="头部大厂">头部大厂</option>
        </select>
      </div>

      <button class="btn-predict" onclick="doPredict()">开始预测</button>
    </div>

    <!-- 预测结果 -->
    <div class="predict-result card" id="resultArea" style="display:none;">
      <h3>预测结果</h3>
      <div class="result-salary" id="salaryRange"></div>
      <div class="result-detail">
        <div class="result-item">
          <span class="result-label">悲观预测</span>
          <span class="result-value" id="pessimistic"></span>
        </div>
        <div class="result-item">
          <span class="result-label">中位预测</span>
          <span class="result-value" id="median"></span>
        </div>
        <div class="result-item">
          <span class="result-label">乐观预测</span>
          <span class="result-value" id="optimistic"></span>
        </div>
        <div class="result-item">
          <span class="result-label">薪资上限</span>
          <span class="result-value" id="highVal"></span>
        </div>
        <div class="result-item">
          <span class="result-label">置信度</span>
          <span class="result-value" id="confidence"></span>
        </div>
      </div>
      <div class="result-chart" id="chartContainer" style="width:100%;height:300px;"></div>
      <div class="result-summary" id="summary"></div>
    </div>

    <!-- 模型概览 -->
    <div class="predict-overview card" id="overviewArea">
      <h3>模型概览</h3>
      <div id="overviewContent">加载中...</div>
    </div>
  </div>
</div>

<style>
.predict-hero {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 40px 30px;
  border-radius: 12px;
  margin-bottom: 24px;
  text-align: center;
}
.predict-hero h1 { font-size: 28px; margin: 0 0 8px; }
.predict-hero p { margin: 0; opacity: 0.9; font-size: 14px; }
.predict-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  max-width: 1000px;
  margin: 0 auto;
}
.predict-form { padding: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 6px;
  font-weight: 500;
}
.form-select, .form-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
}
.form-select:focus, .form-input:focus { border-color: var(--primary); }
.btn-predict {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-predict:hover { opacity: 0.9; }
.predict-result { padding: 24px; }
.result-salary {
  font-size: 36px;
  font-weight: 700;
  color: var(--primary);
  text-align: center;
  padding: 20px 0;
  border-bottom: 2px solid var(--bg);
  margin-bottom: 16px;
}
.result-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.result-item {
  background: var(--bg);
  padding: 12px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.result-label { font-size: 12px; color: var(--text-light); }
.result-value { font-size: 18px; font-weight: 600; }
.predict-overview { padding: 24px; }
.overview-stat {
  display: inline-block;
  background: var(--bg);
  padding: 8px 16px;
  border-radius: 8px;
  margin: 4px;
  font-size: 13px;
}
.overview-stat strong { color: var(--primary); font-size: 16px; }
</style>

<script src="/js/echarts.min.js"></script>
<script src="/js/common.js"></script>
<script>
injectNavbar('predict');

async function loadOverview() {
  try {
    var res = await fetch('/api/overview').then(r => r.json());
    if (res.code === 0) {
      var d = res.data;
      document.getElementById('overviewContent').innerHTML =
        '<div class="overview-stat">样本数 <strong>' + d.n_samples + '</strong></div>' +
        '<div class="overview-stat">特征维度 <strong>' + d.feature_dim + '</strong></div>' +
        '<div class="overview-stat">薪资下限均值 <strong>' + d.y_low_mean.toFixed(1) + 'K</strong></div>' +
        '<div class="overview-stat">薪资上限均值 <strong>' + d.y_high_mean.toFixed(1) + 'K</strong></div>' +
        '<div class="overview-stat">模型类型 <strong>' + d.model_type + '</strong></div>';
    } else {
      document.getElementById('overviewContent').innerHTML = '<span style="color:#e74c3c;">预测服务未启动</span>';
    }
  } catch(e) {
    document.getElementById('overviewContent').innerHTML = '<span style="color:#e74c3c;">预测服务连接失败</span>';
  }
}

async function doPredict() {
  var city = document.getElementById('citySel').value;
  var edu = document.getElementById('eduSel').value;
  var exp = document.getElementById('expSel').value;
  var tags = document.getElementById('tagsInput').value;
  var tier = document.getElementById('tierSel').value;

  var btn = document.querySelector('.btn-predict');
  btn.textContent = '预测中...';
  btn.disabled = true;

  try {
    var url = '/api/predict?city=' + encodeURIComponent(city) +
              '&edu=' + encodeURIComponent(edu) +
              '&exp=' + encodeURIComponent(exp) +
              '&tags=' + encodeURIComponent(tags) +
              '&tier=' + encodeURIComponent(tier);
    var res = await fetch(url).then(r => r.json());

    if (res.code === 0) {
      var d = res.data;
      document.getElementById('resultArea').style.display = 'block';
      document.getElementById('salaryRange').textContent = d.salary_range;
      document.getElementById('pessimistic').textContent = d.salary_low_pessimistic + 'K';
      document.getElementById('median').textContent = d.salary_low_median + 'K';
      document.getElementById('optimistic').textContent = d.salary_low_optimistic + 'K';
      document.getElementById('highVal').textContent = d.salary_high + 'K';
      var confMap = {'mid': '中等', 'low': '较低（波动大）', 'high': '高'};
      document.getElementById('confidence').textContent = confMap[d.confidence] || d.confidence;

      document.getElementById('summary').innerHTML =
        '<p style="text-align:center;color:var(--text-light);font-size:13px;margin-top:12px;">' +
        '在' + d.city + '，' + d.edu + '学历，' + d.exp + '经验，' + d.tier + '工作<br>' +
        '预测薪资中位数为 <strong style="color:var(--primary)">' + d.salary_range + '</strong></p>';

      drawChart(d);
    } else {
      alert('预测失败: ' + (res.msg || '未知错误'));
    }
  } catch(e) {
    alert('请求失败: ' + e.message);
  }

  btn.textContent = '开始预测';
  btn.disabled = false;
}

function drawChart(d) {
  var chart = echarts.init(document.getElementById('chartContainer'));
  chart.setOption({
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: ['悲观(10%)', '中位(50%)', '乐观(90%)', '上限'] },
    yAxis: { type: 'value', name: '薪资(K)' },
    series: [{
      type: 'bar',
      data: [
        { value: d.salary_low_pessimistic, itemStyle: { color: '#e74c3c' } },
        { value: d.salary_low_median, itemStyle: { color: '#f39c12' } },
        { value: d.salary_low_optimistic, itemStyle: { color: '#27ae60' } },
        { value: d.salary_high, itemStyle: { color: '#3498db' } }
      ],
      barWidth: '50%',
      label: { show: true, position: 'top', formatter: '{c}K' }
    }]
  });
}

loadOverview();
</script>
</body>
</html>
