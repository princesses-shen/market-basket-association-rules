<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找回密码 · 智聘</title><link rel="stylesheet" href="/css/style.css">
<style>
.reset-page{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);padding:30px 16px}
.reset-card{background:#fff;border-radius:16px;padding:32px;width:460px;max-width:100%;box-sizing:border-box;box-shadow:0 10px 40px #0003}
.reset-card h1{font-size:24px;margin:0 0 12px}.reset-card p{line-height:1.7}.reset-card label{display:block;margin:14px 0 6px;font-size:14px}
.reset-card input,.reset-card select{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;font:inherit}
.reset-card button{border:0;border-radius:8px;background:var(--primary);color:#fff;padding:12px;cursor:pointer;font:inherit}
.reset-card button:disabled{opacity:.6;cursor:wait}.code-row{display:flex;gap:8px}.code-row input{min-width:0;flex:1}.code-row button{white-space:nowrap}
#resetSubmit{width:100%;margin-top:20px}#message{color:#b42318;min-height:24px}.hint{font-size:13px;color:var(--text-light)}
</style>
</head>
<body>
<div id="navbar-container"></div>
<main class="reset-page"><div class="reset-card">
<h1>找回密码</h1><p class="hint">使用注册邮箱验证身份。被封禁的账号重置密码后，仍需联系管理员解封。</p>
<form id="resetForm">
<label for="accountType">账号类型</label><select id="accountType"><option value="user">用户账号</option><option value="company">企业账号</option></select>
<label for="username">账号</label><input id="username" autocomplete="username" required maxlength="256">
<label for="email">注册邮箱</label><input id="email" type="email" autocomplete="email" required maxlength="254">
<label for="code">邮箱验证码</label><div class="code-row"><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button id="sendCode" type="button">发送验证码</button></div>
<label for="password">新密码</label><input id="password" type="password" autocomplete="new-password" minlength="6" required aria-describedby="passwordHint">
<p id="passwordHint" class="hint">至少 6 位，最多 72 字节。</p>
<label for="confirmation">确认新密码</label><input id="confirmation" type="password" autocomplete="new-password" required>
<button id="resetSubmit" type="submit">重置密码</button>
</form>
<p id="message" role="status" aria-live="polite"></p><p style="text-align:center"><a id="backToLogin" href="/login.html">返回登录</a></p>
</div></main>
<script src="/js/common.js"></script>
<script src="/js/email-code.js"></script>
<script>
injectNavbar('login');
var field = id => document.getElementById(id);
var type = new URLSearchParams(location.search).get('type');
if (type === 'company') field('accountType').value = type;
function identity() { return {accountType:field('accountType').value, username:field('username').value.trim(), email:field('email').value.trim()}; }
function updateBackLink() { field('backToLogin').href = '/login.html?type=' + field('accountType').value; }
field('accountType').addEventListener('change', updateBackLink); updateBackLink();
emailCodeForm({button:'sendCode', code:'code', message:'message', path:'/api/auth/password-reset/code',
  fields:['accountType','username','email'], identity:identity,
  valid:() => field('username').checkValidity() && field('email').checkValidity()});
field('resetForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  if (field('resetSubmit').disabled) return;
  if (field('password').value !== field('confirmation').value) { field('message').textContent = '两次输入的密码不一致'; return; }
  field('resetSubmit').disabled = true;
  try {
    var result = await api('/api/auth/password-reset/confirm', {method:'POST', body:JSON.stringify(
      Object.assign(identity(), {code:field('code').value, newPassword:field('password').value}))});
    field('message').textContent = result.msg;
    if (result.code === 0) {
      clearLogin(); field('resetForm').hidden = true; field('backToLogin').textContent = '密码已更新，返回登录';
    }
  } catch (error) { field('message').textContent = error.message || '网络连接失败，请重试'; }
  finally { field('resetSubmit').disabled = false; }
});
</script>
</body></html>
