<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岗位详情 · 智聘</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-container"></div>

<div class="detail-layout">
  <div class="detail-main">
    <div class="card" id="detailCard">
      <p style="text-align:center;padding:40px;color:#999;">加载中...</p>
    </div>
  </div>
  <div class="detail-side">
    <div class="card">
      <h3>相关推荐</h3>
      <div id="relatedList"></div>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
injectNavbar('');

async function loadDetail() {
  var id = new URLSearchParams(location.search).get('id') || 'job_00001';
  var job = await api('/api/job/detail/' + id);
  if (job.error) {
    document.getElementById('detailCard').innerHTML = '<p style="text-align:center;padding:40px;color:#999;">' + job.error + '</p>';
    return;
  }
  var tags = (job.tags || '').split(';').filter(function(t){return t;}).map(function(t){
    return '<span class="tag">' + t + '</span>';
  }).join('');
  document.getElementById('detailCard').innerHTML =
    '<h2>' + (job.title||'') + '</h2>'
    + '<div style="color:#666;margin:6px 0;">' + (job.company||'') + ' · ' + (job.category||'') + '</div>'
    + '<div class="salary">' + (job.salary_low||'') + '-' + (job.salary_high||'') + 'K</div>'
    + '<div class="meta-row">'
    + '<span>' + (job.city||'') + '</span>'
    + '<span>' + (job.edu||'') + '</span>'
    + '<span>' + (job.exp||'') + '</span>'
    + '<span>' + (job.publish_time||'') + '</span>'
    + '</div>'
    + '<div class="tag-row">' + tags + '</div>'
    + '<div style="border-top:1px solid var(--border);margin:20px 0;"></div>'
    + '<div class="desc-box">' + (job.desc||'暂无描述') + '</div>';

  // 推荐相关岗位
  var related = await api('/api/job/search?city=' + (job.city||'') + '&size=5');
  var el = document.getElementById('relatedList');
  if (related.list && related.list.length > 0) {
    el.innerHTML = related.list.filter(function(j){return j.rowKey !== id;}).slice(0,4).map(function(j){
      return '<div class="job-card" style="margin-bottom:10px;padding:12px;" onclick="location.href=\'/detail.html?id=' + j.rowKey + '\'">'
        + '<div class="job-main"><div class="job-title" style="font-size:15px;">' + (j.title||'') + '</div>'
        + '<div class="job-company" style="font-size:12px;">' + (j.company||'') + '</div></div>'
        + '<div class="job-salary" style="font-size:14px;">' + (j.salary_low||'') + '-' + (j.salary_high||'') + 'K</div></div>';
    }).join('');
  } else {
    el.innerHTML = '<p style="color:#999;text-align:center;">暂无推荐</p>';
  }
}

loadDetail();
</script>
</body>
</html>
