<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公告管理 · 智聘</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/announcements.css"></head>
<body><div id="navbar-container"></div><main class="announcement-page" data-announcements="admin">
<h1>公告管理</h1><p class="announcement-hint">发布后所有访客都可查看。编辑公告会保留原发布时间。</p>
<section class="announcement-panel"><h2 id="announcement-editor-title">发布公告</h2>
<form id="announcement-form"><div class="announcement-field"><label for="announcement-input-title">标题</label><input id="announcement-input-title" required aria-describedby="announcement-title-help"><small id="announcement-title-help">最多 100 字</small></div>
<div class="announcement-field"><label for="announcement-input-body">正文</label><textarea id="announcement-input-body" required aria-describedby="announcement-body-help"></textarea><small id="announcement-body-help">最多 10,000 字，支持换行，以纯文本展示</small></div>
<div class="announcement-actions"><button id="announcement-save" type="submit">发布公告</button><button id="announcement-cancel" class="secondary" type="button" hidden>取消编辑</button></div>
<p id="announcement-form-status" class="announcement-status" role="status" aria-live="polite"></p></form></section>
<section class="announcement-panel"><div class="announcement-heading"><h2>已发布公告</h2><a href="/announcements.html">查看网站公告 →</a></div>
<p id="announcement-status" class="announcement-status" role="status" aria-live="polite"></p><button id="announcement-retry" hidden>重新加载</button>
<div id="announcement-list"></div><div class="announcement-pager"><button id="announcement-prev" class="secondary">上一页</button><span id="announcement-page-label"></span><button id="announcement-next" class="secondary">下一页</button></div>
</section></main><script src="/js/common.js"></script><script src="/js/announcements.js"></script></body></html>
