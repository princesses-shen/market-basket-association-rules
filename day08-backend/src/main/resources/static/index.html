<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智聘 · 招聘分析平台</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/announcements.css">
</head>
<body>
<div id="navbar-container"></div>

<!-- 搜索区 -->
<div class="search-hero">
  <h1>找到你的下一份工作</h1>
  <p>1200+ 热门岗位，实时数据大屏分析</p>
  <div class="search-box">
    <select id="citySel">
      <option value="">全部城市</option>
    </select>
    <input type="text" id="kwInput" placeholder="搜索岗位、公司或技能关键词...">
    <button onclick="goSearch()">搜索</button>
  </div>
</div>

<!-- 推荐岗位 -->
<section class="announcement-page announcement-home" data-announcements="home" aria-label="最新公告">
  <div class="announcement-panel"><div class="announcement-heading"><h2>网站公告</h2><a href="/announcements.html">查看全部 →</a></div>
    <p id="announcement-status" class="announcement-status" role="status" aria-live="polite"></p><button id="announcement-retry" hidden>重新加载</button><div id="announcement-list"></div>
  </div>
</section>

<!-- 推荐岗位列表 -->
<div style="max-width:1200px;margin:24px auto;padding:0 20px;">
  <div class="card">
    <h3>推荐岗位</h3>
    <div id="featuredList"></div>
  </div>
</div>

<!-- 热门城市 -->
<div style="max-width:1200px;margin:24px auto;padding:0 20px;">
  <div class="card">
    <h3>热门城市</h3>
    <div class="city-grid" id="cityGrid"></div>
  </div>
</div>

<!-- 求职咨询 -->
<div style="max-width:1200px;margin:24px auto;padding:0 20px;">
  <div class="card">
    <h3 style="display:flex;justify-content:space-between;align-items:center;">
      <span>💡 求职咨询</span>
      <a href="/forum.html" style="font-size:13px;font-weight:normal;">更多文章 →</a>
    </h3>
    <div id="forumList" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">
      <div style="color:#999;text-align:center;padding:20px;">加载中...</div>
    </div>
  </div>
</div>

<!-- 底部 -->
<div style="text-align:center;padding:40px;color:#999;font-size:14px;">
  <p style="margin-bottom:8px;">
    <a href="/dashboard.html" style="color:var(--primary);margin:0 12px;">📊 数据大屏</a>
    <a href="/forum.html" style="color:var(--primary);margin:0 12px;">💡 求职咨询</a>
    <a href="/search.html" style="color:var(--primary);margin:0 12px;">🔍 找工作</a>
  </p>
  <p style="margin-top:12px;">智聘招聘分析平台 © 2026 | 基于 Hadoop-HBase + Spring Boot + ECharts</p>
</div>

<script src="/js/common.js"></script>
<script src="/js/announcements.js"></script>
<script>
injectNavbar('home');

// 加载城市列表
async function loadCities() {
  var cities = await api('/api/job/cities');
  var sel = document.getElementById('citySel');
  cities.forEach(function(c) {
    var o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
  // 热门城市卡片
  var grid = document.getElementById('cityGrid');
  cities.slice(0, 10).forEach(function(c) {
    grid.innerHTML += '<div class="city-card" onclick="location.href=\'/search.html?city='+c+'\'">'
      + '<div class="city-name">' + c + '</div>'
      + '<div class="city-count">点击查看岗位</div></div>';
  });
}

// 加载推荐岗位
async function loadFeatured() {
  var jobs = await api('/api/job/featured');
  var el = document.getElementById('featuredList');
  if (!jobs || jobs.length === 0) {
    el.innerHTML = '<p style="text-align:center;color:#999;">暂无推荐岗位</p>';
    return;
  }
  el.innerHTML = jobs.map(jobCardHTML).join('');
}

function goSearch() {
  var city = document.getElementById('citySel').value;
  var kw = document.getElementById('kwInput').value;
  var url = '/search.html?';
  if (city) url += 'city=' + encodeURIComponent(city) + '&';
  if (kw) url += 'keyword=' + encodeURIComponent(kw);
  location.href = url;
}

document.getElementById('kwInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') goSearch();
});

loadCities();
loadFeatured();
loadForumArticles();

// 加载求职咨询文章
async function loadForumArticles() {
  var data = await api('/api/forum/list?size=3');
  var el = document.getElementById('forumList');
  if (!data || !data.list || data.list.length === 0) {
    el.innerHTML = '<p style="text-align:center;color:#999;">暂无文章</p>';
    return;
  }
  el.innerHTML = data.list.map(function(a) {
    return '<div onclick="location.href=\'/article.html?id=' + a.id + '\'"'
      + ' style="background:linear-gradient(135deg,#f8faff,#eef3ff);border-radius:10px;padding:18px;'
      + 'cursor:pointer;transition:all .2s;border:1px solid #e0e8f0;'
      + '" onmouseover="this.style.transform=\'translateY(-3px)\';this.style.boxShadow=\'0 4px 12px rgba(0,0,0,0.1)\'"'
      + ' onmouseout="this.style.transform=\'translateY(0)\';this.style.boxShadow=\'none\'">'
      + '<div style="font-size:32px;margin-bottom:8px;">' + (a.cover || '📄') + '</div>'
      + '<div style="font-size:15px;font-weight:600;color:var(--primary-dark);margin-bottom:6px;'
      + 'display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;">'
      + a.title + '</div>'
      + '<div style="font-size:12px;color:var(--text-light);margin-bottom:8px;">'
      + a.category + ' · ' + a.author + '</div>'
      + '<div style="font-size:12px;color:#999;display:flex;gap:12px;">'
      + '<span>👁 ' + a.views + '</span>'
      + '<span>👍 ' + a.likes + '</span>'
      + '<span>💬 ' + a.comments_count + '</span>'
      + '</div></div>';
  }).join('');
}
</script>
</body>
</html>
